    * {

    body {
      background: #0a0f1e;
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    /* ---------- LOADING SCREEN (SPLASH) ---------- */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0c1222, #05080f);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      backdrop-filter: blur(2px);
      transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1), visibility 0.8s;
    }
    .loading-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      animation: fadeGlow 0.6s ease-out;
    }
    .loading-content img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 32px;
      box-shadow: 0 25px 40px rgba(0,0,0,0.5), 0 0 0 2px rgba(80, 200, 120, 0.2);
      transition: transform 0.3s;
    }
    .circular-progress {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .progress-ring {
      transform: rotate(-90deg);
    }
    .progress-ring__circle {
      stroke: #4ade80;
      stroke-width: 5;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 226.2;
      stroke-dashoffset: 226.2;
      transition: stroke-dashoffset 0.1s linear;
      filter: drop-shadow(0 0 5px #4ade80);
    }
    .progress-bg {
      stroke: rgba(255,255,255,0.2);
      stroke-width: 5;
      fill: none;
    }
    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #d1fae5;
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 4px #22c55e;
    }

    /* ---------- MAIN APP CONTAINER ---------- */
    .main-app {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease;
      min-height: 100vh;
      width: 100%;
    }
    .main-app.visible {
      opacity: 1;
      visibility: visible;
    }

    /* ---------- PAGE WRAPPER ---------- */
    .page-container {
      width: 100%;
      min-height: 100vh;
      padding: 2rem;
      transition: all 0.25s;
    }

    /* MAIN CARDS SECTION */
    .cards-panel {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      min-height: 80vh;
    }
    .cards-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3rem;
      flex-wrap: wrap;
      width: 100%;
    }

    /* GLASS CARD BASE */
    .glass-card {
      width: 320px;
      padding: 2rem 1.8rem;
      border-radius: 2rem;
      backdrop-filter: blur(12px);
      background: rgba(20, 30, 25, 0.35);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.4);
      transition: all 0.35s ease;
      cursor: pointer;
      text-align: center;
      color: #f0f3f8;
    }
    .glass-card:hover {
      transform: translateY(-12px);
      backdrop-filter: blur(16px);
      box-shadow: 0 30px 45px -12px rgba(0,0,0,0.5);
    }
    .card-dark {
      background: linear-gradient(135deg, rgba(16, 55, 40, 0.65), rgba(30, 95, 60, 0.5));
      border-top: 1px solid #4ade80;
      border-left: 1px solid #34d399;
    }
    .card-light {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,240,0.5);
      color: #111;
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.2);
    }
    .card-light h2, .card-light p {
      color: #1e2a2a;
      text-shadow: none;
    }
    .card-light .card-icon {
      background: rgba(0,0,0,0.1);
      color: #34d399;
    }
    .card-icon {
      font-size: 3.2rem;
      margin-bottom: 1.2rem;
      background: rgba(74, 222, 128, 0.2);
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin-left: auto;
      margin-right: auto;
      backdrop-filter: blur(4px);
    }
    .glass-card h2 {
      font-size: 2rem;
      margin: 0.75rem 0;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .glass-card p {
      opacity: 0.85;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      background: rgba(0,0,0,0.3);
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      backdrop-filter: blur(2px);
    }
    .card-dark .card-icon {

      color: white;
      box-shadow: 0 0 12px #4ade8066;
    }
    .hidden-page {
      display: none !important;
    }
    @keyframes fadeGlow {
      0% { opacity: 0; transform: scale(0.96);}
      100% { opacity: 1; transform: scale(1);}
    }

    .global-back-btn {

      right: 20px;

      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 500;
      background: #0a0f1e;
    }

      width: 100%;
      height: 100%;
      border: none;
    }

  // ---------- LOADING SIMULATION ----------
  const loadingScreen = document.getElementById('loadingScreen');
  const mainAppDiv = document.getElementById('mainApp');
  const progressCircle = document.querySelector('.progress-ring__circle');
  const percentSpan = document.getElementById('progressPercent');
  const circumference = 226.2;

  let progress = 0;
  const interval = setInterval(() => {
    if (progress < 100) {
      progress += Math.floor(Math.random() * 8) + 2;
      if (progress > 100) progress = 100;
      const offset = circumference - (progress / 100) * circumference;
      if (progressCircle) progressCircle.style.strokeDashoffset = offset;
      percentSpan.innerText = progress + '%';
    }
    if (progress >= 100) {
      clearInterval(interval);
      percentSpan.innerText = '100%';
      if (progressCircle) progressCircle.style.strokeDashoffset = 0;
      setTimeout(() => {
        loadingScreen.style.opacity = '0';
        loadingScreen.style.visibility = 'hidden';
        mainAppDiv.classList.add('visible');
      }, 300);
    }
  }, 80);

  setTimeout(() => {
    if (progress < 100) {
      clearInterval(interval);
      progress = 100;
      percentSpan.innerText = '100%';
      if (progressCircle) progressCircle.style.strokeDashoffset = 0;
      loadingScreen.style.opacity = '0';
      loadingScreen.style.visibility = 'hidden';
      mainAppDiv.classList.add('visible');
    }
  }, 4000);

  const iframeContainer = document.getElementById('iframeContainer');
  const appIframe = document.getElementById('appIframe');
  const globalBackBtn = document.getElementById('globalBackBtn');

    iframeContainer.classList.add('hidden-page');
    cardsView.classList.remove('hidden-page');
    appIframe.srcdoc = '';
    document.body.style.overflow = '';
  }

  globalBackBtn.addEventListener('click', goBackToCards);

  function openPageInIframe(htmlContent) {
    cardsView.classList.add('hidden-page');
    iframeContainer.classList.remove('hidden-page');
    appIframe.srcdoc = htmlContent;
    appIframe.onload = () => {
      try { appIframe.contentWindow.scrollTo(0, 0); } catch(e) {}
    };
  }

        function generateMagicGrid(targetNumber) {
            if (targetNumber === 0) return null;
            const quotient = Math.floor(targetNumber / 12);
            const remainder = targetNumber % 12;
            const values = {
                '1': quotient * 1,
                '8': (quotient * 8) + remainder,
                '3': quotient * 3,
                '5': quotient * 5,
                '7': (quotient * 7) + remainder,
                '6': (quotient * 6) + remainder,
                '4': quotient * 4,
                '2': quotient * 2
            };
            return [
                { label: '(1)', value: values['1'], position: 'row1-col1' },
                { label: '(8)', value: values['8'], position: 'row1-col2' },

        function calculateIsm(val) {
            const container = document.getElementById('virtues-container');
            const ismDisplay = document.getElementById('ism-e-azam');
            container.innerHTML = "";
            if (val === 0) { ismDisplay.innerText = "-"; return; }
            let exactMatches = asmaUlHusna.filter(a => a.value === val);
            let pairMatches = [], tripleMatches = [];
            if (exactMatches.length === 0) {
                for (let i=0; i<asmaUlHusna.length; i++) {
                    for (let j=i+1; j<asmaUlHusna.length; j++) {
                        if (asmaUlHusna[i].value + asmaUlHusna[j].value === val) {
                            pairMatches.push([asmaUlHusna[i], asmaUlHusna[j]]);
                        }
                    }
                }
            }
            if (exactMatches.length === 0 && pairMatches.length === 0) {
                for (let i=0; i<asmaUlHusna.length; i++) {
                    for (let j=i+1; j<asmaUlHusna.length; j++) {
                        for (let k=j+1; k<asmaUlHusna.length; k++) {
                            if (asmaUlHusna[i].value + asmaUlHusna[j].value + asmaUlHusna[k].value === val) {
                                tripleMatches.push([asmaUlHusna[i], asmaUlHusna[j], asmaUlHusna[k]]);

                    }
                }
            }
            let html = '';

                html += '</div></div>';

            } else if (pairMatches.length > 0) {
                html += '<div class="combination-section"><div class="combination-title">🔗 دو اسماء کے مجموعے 🔗</div><div class="combination-grid">';

    <script>
        let map, marker, saatData = [];

        const saatTableData = {
            "Sun": { name: "شمس", type: "سعد", class: "text-saad" },
            "Moon": { name: "قمر", type: "سعد انفصال", class: "text-saad-infisaal" },
            "Mars": { name: "مریخ", type: "نحس", class: "text-nahas" },
            "Mercury": { name: "عطارد", type: "ممتزج", class: "text-mumtazij" },
            "Jupiter": { name: "مشتری", type: "سعد اتصال", class: "text-saad-itisaal" },
            "Venus": { name: "زہرہ", type: "سعد اتصال", class: "text-saad-itisaal" },
            "Saturn": { name: "زحل", type: "نحس", class: "text-nahas" }
        };

        const planetaryOrder = ["Saturn", "Jupiter", "Mars", "Sun", "Venus", "Mercury", "Moon"];
        const dayStartPlanets = ["Sun", "Moon", "Mars", "Mercury", "Jupiter", "Venus", "Saturn"];

        const LS_KEYS = {
            theme: 'saat_theme',
            lat: 'saat_lat',
            lon: 'saat_lon',
            date: 'saat_date',
            tz: 'saat_tz'
        };

        const DEFAULT_LAT = 31.3753;
        const DEFAULT_LON = 73.3451;

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            if (currentTheme === 'light') {
                body.removeAttribute('data-theme');
                localStorage.setItem(LS_KEYS.theme, 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                localStorage.setItem(LS_KEYS.theme, 'light');
            }
        }

        async function detectTimezone(lat, lon) {
            try {
                const res = await fetch('https://api.bigdatacloud.net/data/timezone-by-location?latitude=' + lat + '&longitude=' + lon + '&key=demo');
                if (!res.ok) throw new Error('tz api fail');
                const data = await res.json();
                if (data && data.timeZoneId) return data.timeZoneId;
            } catch(e) {
                try {
                    const res2 = await fetch('https://timeapi.io/api/TimeZone/coordinate?latitude=' + lat + '&longitude=' + lon);
                    if (res2.ok) {
                        const d2 = await res2.json();
                        if (d2 && d2.timeZone) return d2.timeZone;
                    }
                } catch(e2) {}
            }
            return null;
        }

        function updateLocationStatus(msg, color) {
            const el = document.getElementById('locationStatus');
            if (el) {
                el.textContent = msg;
                el.style.color = color || 'var(--gold-light)';
            }
        }

        async function onMarkerMoved(lat, lon) {
            document.getElementById('lat').value = parseFloat(lat).toFixed(6);
            document.getElementById('lon').value = parseFloat(lon).toFixed(6);
            updateLocationStatus('⏳ ٹائم زون تلاش کیا جا رہا ہے...', 'var(--gold-light)');
            const tz = await detectTimezone(lat, lon);
            if (tz) {
                const tzSel = document.getElementById('tzSelect');
                let found = false;
                for (let i=0; i<tzSel.options.length; i++) {
                    if (tzSel.options[i].value === tz) { found = true; break; }
                }
                if (!found) {
                    const opt = document.createElement('option');
                    opt.value = tz; opt.text = tz;
                    tzSel.appendChild(opt);
                }
                tzSel.value = tz;
                updateLocationStatus('✅ ٹائم زون: ' + tz, '#34d399');
            } else {
                updateLocationStatus('⚠️ ٹائم زون خودکار نہیں ملا — دستی انتخاب کریں', '#f59e0b');
            }
        }

        function initApp() {
            const savedTheme = localStorage.getItem(LS_KEYS.theme);
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
            }

            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    const main = document.getElementById('main-content');
                    main.style.opacity = '1';
                    main.style.transform = 'translateY(0)';
                }, 500);
            }, 3500);

            const dateInput = document.getElementById('dateInput');
            const savedDate = localStorage.getItem(LS_KEYS.date);
            if (savedDate) {
                dateInput.value = savedDate;
            } else {
                dateInput.valueAsDate = new Date();
            }
            dateInput.addEventListener('change', () => {
                localStorage.setItem(LS_KEYS.date, dateInput.value);
            });

            const tzSel = document.getElementById('tzSelect');
            try {
                Intl.supportedValuesOf('timeZone').forEach(tz => {
                    let opt = document.createElement('option'); opt.value = tz; opt.text = tz; tzSel.appendChild(opt);
                });
            } catch(e) {
                const common = ['UTC','Asia/Karachi','Asia/Kolkata','Asia/Dubai','Europe/London','America/New_York','America/Los_Angeles','Asia/Riyadh','Asia/Tehran'];
                common.forEach(tz => { let opt = document.createElement('option'); opt.value = tz; opt.text = tz; tzSel.appendChild(opt); });
            }
            const savedTz = localStorage.getItem(LS_KEYS.tz) || Intl.DateTimeFormat().resolvedOptions().timeZone;
            tzSel.value = savedTz;
            tzSel.addEventListener('change', () => {
                localStorage.setItem(LS_KEYS.tz, tzSel.value);
            });

            const savedLat = localStorage.getItem(LS_KEYS.lat);
            const savedLon = localStorage.getItem(LS_KEYS.lon);
            const initialLat = savedLat ? parseFloat(savedLat) : DEFAULT_LAT;
            const initialLon = savedLon ? parseFloat(savedLon) : DEFAULT_LON;
            document.getElementById('lat').value = initialLat;
            document.getElementById('lon').value = initialLon;

            map = L.map('modal-map').setView([initialLat, initialLon], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            marker = L.marker([initialLat, initialLon], {draggable: true}).addTo(map);

            map.on('click', (e) => {
                marker.setLatLng(e.latlng);
                onMarkerMoved(e.latlng.lat, e.latlng.lng);
            });

            marker.on('dragend', (e) => {
                const pos = marker.getLatLng();
                onMarkerMoved(pos.lat, pos.lng);
            });

            if (!savedLat && !savedLon && navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    const lat = p.coords.latitude;
                    const lon = p.coords.longitude;
                    marker.setLatLng([lat, lon]);
                    map.setView([lat, lon], 12);
                    onMarkerMoved(lat, lon);
                }, () => {}, { timeout: 8000 });
            }

            loadSaats();
        }

        async function loadSaats() {
            const lat = parseFloat(document.getElementById('lat').value) || DEFAULT_LAT;
            const lon = parseFloat(document.getElementById('lon').value) || DEFAULT_LON;
            const date = document.getElementById('dateInput').value;
            if (!date) return;
            try {
                const res = await fetch('https://api.sunrise-sunset.org/json?lat=' + lat + '&lng=' + lon + '&date=' + date + '&formatted=0');
                const data = await res.json();
                if (data && data.results) {
                    const sunrise = new Date(data.results.sunrise);
                    const sunset = new Date(data.results.sunset);
                    document.getElementById('sunDisplay').innerText =
                        sunrise.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) + ' | ' +
                        sunset.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
                    calculateSaats(sunrise, sunset);
                }
            } catch(e) {
                const now = new Date();
                const sunrise = new Date(now); sunrise.setHours(6,0,0,0);
                const sunset = new Date(now); sunset.setHours(18,0,0,0);
                document.getElementById('sunDisplay').innerText = '06:00 | 18:00';
                calculateSaats(sunrise, sunset);
            }
        }

        async function saveSettings() {
            toggleModal(false);
            const lat = parseFloat(document.getElementById('lat').value) || DEFAULT_LAT;
            const lon = parseFloat(document.getElementById('lon').value) || DEFAULT_LON;
            const date = document.getElementById('dateInput').value;
            const tz = document.getElementById('tzSelect').value;

            localStorage.setItem(LS_KEYS.lat, lat);
            localStorage.setItem(LS_KEYS.lon, lon);
            localStorage.setItem(LS_KEYS.date, date);
            localStorage.setItem(LS_KEYS.tz, tz);

            if (marker) {
                const cur = marker.getLatLng();
                if (Math.abs(cur.lat - lat) > 1e-6 || Math.abs(cur.lng - lon) > 1e-6) {
                    marker.setLatLng([lat, lon]);
                    if (map) map.setView([lat, lon], Math.max(map.getZoom(), 10));
                }
            }

            loadSaats();
        }

        function calculateSaats(sunrise, sunset) {
            const dayDur = (sunset - sunrise) / 12;
            const nightDur = (86400000 - (sunset - sunrise)) / 12;
            let startPlanet = dayStartPlanets[sunrise.getDay()];
            let startIndex = planetaryOrder.indexOf(startPlanet);

            saatData = [];
            let curr = new Date(sunrise);
            for(let i=0; i<24; i++) {
                let end = new Date(curr.getTime() + (i < 12 ? dayDur : nightDur));
                let pKey = planetaryOrder[(startIndex + i) % 7];
                let info = saatTableData[pKey];
                saatData.push({ ...info, start: new Date(curr), end: end });
                curr = end;
            }
            renderUI();
        }

        function renderUI() {
            const dayL = document.getElementById('dayList');
            const nightL = document.getElementById('nightList');
            dayL.innerHTML = ''; nightL.innerHTML = '';
            saatData.forEach((s, i) => {
                const card = '<div class="saat-card" id="saat-' + i + '">' +
                        '<div>' +
                            '<span class="saat-name ' + s.class + '">' + s.name + '</span>' +
                            '<span class="saat-detail">' + s.type + '</span>' +
                        '</div>' +
                        '<div style="text-align:left;">' +
                            '<div class="time-val">' + s.start.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) + '</div>' +
                            '<div class="time-val" style="opacity:0.5; font-size:0.8rem;">تا ' + s.end.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}) + '</div>' +
                        '</div>' +
                    '</div>';
                if(i < 12) dayL.innerHTML += card; else nightL.innerHTML += card;
            });
        }

        function toggleModal(s) {
            document.getElementById('settingsModal').style.display = s ? 'flex' : 'none';
            if (s) setTimeout(()=>map.invalidateSize(), 250);
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('en-GB');
            document.getElementById('live-date').innerText = now.toLocaleDateString('ur-PK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            saatData.forEach((s, i) => {
                const el = document.getElementById('saat-' + i);
                if (!el) return;
                if(now >= s.start && now < s.end) {
                    el.classList.add('active');
                    const heroTitle = document.getElementById('curNameHero');
                    heroTitle.innerText = s.name + ' (' + s.type + ')';
                    heroTitle.className = s.class;
                    let diff = Math.floor((s.end - now) / 1000);
                    document.getElementById('currCountdown').innerText = Math.floor(diff/60) + ' منٹ ' + (diff%60) + ' سیکنڈ باقی';
                    if(saatData[i+1]) {
                        document.getElementById('nextNameHero').innerText = saatData[i+1].name;
                        let nDiff = Math.floor((saatData[i+1].start - now) / 60000);
                        document.getElementById('nextCountdown').innerText = '  آغاز ' + nDiff + '   منٹ میں';
                    }
                } else {
                    el.classList.remove('active');
                }
            });
        }, 1000);
    <\/script>
</body>
</html>`;

  // ---------- ATTACH CARD CLICK HANDLERS ----------
  document.getElementById('cardIsmeAzam').addEventListener('click', () => openPageInIframe(ismeAzamHTML));
  document.getElementById('cardSaat').addEventListener('click', () => openPageInIframe(saatHTML));

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !iframeContainer.classList.contains('hidden-page')) {
      goBackToCards();
    }
  });
</script>
</body>
